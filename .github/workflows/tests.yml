name: tests

# Cross-OS CI companion to scripts/test_cross_os_hygiene.py: that test is a
# STATIC gate (no code actually executes on another OS), this workflow is
# the DYNAMIC complement — it runs the real scripts/ pytest suite on
# Linux, Windows, and macOS so behavioral cross-OS regressions (not just
# the syntactic anti-patterns the static gate catches) surface in CI
# instead of being caught manually after the fact.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-authority:
    name: deterministic CI dependency authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bootstrap and run the deterministic dependency authority
        run: python -I scripts/ci_dependency_authority.py bootstrap-gate --root .

  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    needs: lock-authority
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    env:
      # Non-interactive guard: makes the driver's halt/purge prompts
      # (wait_halt_choice / wait_critical_halt_choice / wait_purge_choice)
      # auto-answer instead of blocking on a keypress. Without this the
      # integration lane (test_driver_smoke) hangs forever under CI's
      # (pseudo-)tty. `exit` = stop cleanly / keep artifacts (never auto-purge).
      PLAMEN_AUTO_HALT_CHOICE: "exit"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install reviewed, hash-locked CI dependencies
        shell: bash
        run: |
          set -e
          if [ ! -f requirements-ci.lock ]; then
            echo "::error::requirements-ci.lock is required; refusing an unpinned network fallback"
            exit 1
          fi
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock

      # Two lanes, together = the full suite (no test is skipped across them):
      #   fast lane        — everything EXCEPT the ~14 real-subprocess/timing
      #                      files, parallelized with xdist (`-n auto`).
      #   integration lane — ONLY those heavy files, run SERIALLY (they spawn
      #                      real processes / assert on real timing; xdist would
      #                      make them flaky). PLAMEN_AUTO_HALT_CHOICE=exit (job
      #                      env) keeps the driver-loop tests from hanging.
      # The lanes are separate steps so a failure names which class broke, and
      # so wall-clock is dominated by the parallel fast lane, not the serial one.
      - name: Fast lane (unit — parallel)
        shell: bash
        run: |
          cd scripts && python -m pytest -m "not integration" -n auto -q

      - name: Integration lane (real subprocess/timing — serial)
        shell: bash
        run: |
          cd scripts && python -m pytest -m "integration" -q

  dependency-review:
    name: dependency review (introduced High/Critical)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          warn-only: false

  dependency-submission:
    name: submit exact CI lock dependency snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lock-authority
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and submit the exact reviewed lock denominator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCANNED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python scripts/ci_dependency_authority.py dependency-snapshot \
            --root . \
            --output "$RUNNER_TEMP/dependency-snapshot.json" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --scanned "$SCANNED"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data-binary "@$RUNNER_TEMP/dependency-snapshot.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/snapshots"
