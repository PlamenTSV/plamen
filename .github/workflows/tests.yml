name: tests

# Cross-OS CI companion to scripts/test_cross_os_hygiene.py: that test is a
# STATIC gate (no code actually executes on another OS), this workflow is
# the DYNAMIC complement — it runs the real scripts/ pytest suite on
# Linux, Windows, and macOS so behavioral cross-OS regressions (not just
# the syntactic anti-patterns the static gate catches) surface in CI
# instead of being caught manually after the fact.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-authority:
    name: dependency authority (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bootstrap and run the deterministic dependency authority
        run: python -I scripts/ci_dependency_authority.py bootstrap-gate --root .

  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    needs: lock-authority
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    env:
      # Non-interactive guard: makes the driver's halt/purge prompts
      # (wait_halt_choice / wait_critical_halt_choice / wait_purge_choice)
      # auto-answer instead of blocking on a keypress. Without this the
      # integration lane (test_driver_smoke) hangs forever under CI's
      # (pseudo-)tty. `exit` = stop cleanly / keep artifacts (never auto-purge).
      PLAMEN_AUTO_HALT_CHOICE: "exit"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install reviewed, hash-locked CI dependencies
        shell: bash
        run: |
          set -e
          if [ ! -f requirements-ci.lock ]; then
            echo "::error::requirements-ci.lock is required; refusing an unpinned network fallback"
            exit 1
          fi
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock

      # Three lanes form an exact total partition of the collected suite:
      #   fast lane        — ordinary unit tests, parallelized with xdist.
      #   integration lane — real subprocess/timing tests, run serially.
      #   quarantine lane  — exact manifest-bound capability probes excluded
      #                      from the release-fast numerator, run serially.
      # Every collected test is selected exactly once. Capability-dependent
      # skips inside the quarantine lane remain governed by the authenticated
      # fast-lane manifest. PLAMEN_AUTO_HALT_CHOICE=exit (job env) keeps the
      # driver-loop tests from hanging.
      - name: Windows collection denominator guard
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "scripts"
          $collection = @(& python -m pytest --collect-only -q scripts tests 2>&1)
          $pytestExit = $LASTEXITCODE
          if ($pytestExit -ne 0) {
            $collection | Out-Host
            throw "Complete Windows pytest collection failed with exit code $pytestExit"
          }

          $expected = @(
            "tests/test_windows_private_execution_root_p0.py::test_modify_only_baseline_reproduces_write_owner_error5"
            "tests/test_windows_private_execution_root_p0.py::test_private_root_handle_low_restore_and_fresh_leaf"
            "tests/test_windows_private_execution_root_p0.py::test_retained_root_blocks_path_swap_and_rejects_dacl_drift"
            "tests/test_windows_private_execution_root_p0.py::test_preexisting_reparse_is_rejected_without_following"
            "tests/test_windows_private_execution_root_p0.py::test_reparse_parent_is_rejected_before_leaf_creation"
            "tests/test_windows_private_execution_root_p0.py::test_private_authority_integrates_with_low_lease"
            "tests/test_windows_private_execution_root_p0.py::test_real_low_job_writes_private_root_not_medium_sibling"
            "tests/test_windows_private_execution_root_p0.py::test_auxiliary_lease_carries_private_authority_and_abort_closes_it"
            "tests/test_windows_private_execution_root_p0.py::test_real_wer_provider_uses_private_root_without_scratch_acl_mutation"
            "tests/test_windows_private_execution_root_p0.py::test_real_command_capable_claude_fixture_uses_private_mic_root"
          )
          $prefix = "tests/test_windows_private_execution_root_p0.py::"
          $actual = @(
            $collection |
              ForEach-Object { "$($_)".Replace('\', '/') } |
              Where-Object { $_.StartsWith($prefix) }
          )
          $missing = @($expected | Where-Object { $_ -notin $actual })
          $unexpected = @($actual | Where-Object { $_ -notin $expected })
          if ($actual.Count -ne $expected.Count -or $missing.Count -ne 0 -or $unexpected.Count -ne 0) {
            Write-Error "Windows native denominator mismatch: expected 10 nodes, collected $($actual.Count)"
            if ($missing.Count -ne 0) {
              Write-Error "Missing nodes: $($missing -join ', ')"
            }
            if ($unexpected.Count -ne 0) {
              Write-Error "Unexpected nodes: $($unexpected -join ', ')"
            }
            exit 1
          }
          Write-Host "Collected the exact 10-node Windows native denominator."

      - name: Fast lane (unit — parallel)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PYTHONPATH="$PWD/scripts" python -m pytest scripts tests -m "not integration and not fast_quarantine" -n auto -q

      - name: Windows fast lane (unit — parallel)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "scripts"
          python -m pytest scripts tests -m "not integration and not fast_quarantine" -n auto -q

      - name: Integration lane (real subprocess/timing — serial)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PYTHONPATH="$PWD/scripts" python -m pytest scripts tests -m "integration" -q

      - name: Windows integration lane (real subprocess/timing — serial)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "scripts"
          python -m pytest scripts tests -m "integration" -q

      - name: Quarantine lane (manifest-bound capability probes — serial)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PYTHONPATH="$PWD/scripts" python -m pytest scripts tests -m "fast_quarantine and not integration" -q

      - name: Windows quarantine lane (manifest-bound capability probes — serial)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "scripts"
          python -m pytest scripts tests -m "fast_quarantine and not integration" -q

  dependency-review:
    name: dependency review (introduced High/Critical)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          warn-only: false

  dependency-submission:
    name: submit exact CI lock dependency snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lock-authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and submit the exact reviewed lock denominator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCANNED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python scripts/ci_dependency_authority.py dependency-snapshot \
            --root . \
            --output "$RUNNER_TEMP/dependency-snapshot.json" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --scanned "$SCANNED"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data-binary "@$RUNNER_TEMP/dependency-snapshot.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/snapshots"
