name: install-smoke

on:
  push:
    branches:
      - main
      - Plamen-v3
      - feat/**
      - fix/**
  pull_request:

permissions:
  contents: read

jobs:
  lock-authority:
    name: deterministic CI dependency authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bootstrap and run the deterministic dependency authority
        run: python -I scripts/ci_dependency_authority.py bootstrap-gate --root .

  # F2 regression guard: `plamen install` must complete cleanly without a
  # controlling terminal. Claude Code's Bash tool, Codex shells, and CI all
  # run with stdin redirected from /dev/null. The wizard's InquirerPy picker
  # crashes there with `OSError: [Errno 22]`; install must NOT touch it.
  non-tty-install:
    name: non-TTY install (${{ matrix.os }} / py${{ matrix.python }})
    needs: lock-authority
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed, hash-locked CI dependencies
        shell: bash
        run: |
          set -e
          if [ ! -f requirements-ci.lock ]; then
            echo "::error::requirements-ci.lock is required; refusing an unpinned network fallback"
            exit 1
          fi
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock
      - name: Syntax check plamen.py + scripts/
        run: |
          python -m py_compile plamen.py
          python -m py_compile scripts/codex_adapter.py
      - name: plamen --help (banner + dispatch)
        # If main()'s argument parsing or banner breaks, fail loud.
        run: python plamen.py help
      - name: Clean managed install without ambient Node or backend CLIs
        # Exercise the public bootstrap contract, not a hosted-runner accident:
        # no ambient node/npm/npx/claude/codex and no pre-existing backend home.
        # The absolute CPython process remains the only executable prerequisite;
        # Plamen downloads and authenticates its reviewed Node/npm closure.
        shell: bash
        run: |
          set -e
          PYTHON_BIN=$(command -v python)
          CLEAN_HOME="$RUNNER_TEMP/plamen-clean-home"
          mkdir -p "$CLEAN_HOME"
          export HOME="$CLEAN_HOME"
          export USERPROFILE="$CLEAN_HOME"
          export PATH=""
          "$PYTHON_BIN" -c "import shutil; assert all(shutil.which(x) is None for x in ('node','npm','npx','claude','codex'))"
          "$PYTHON_BIN" plamen.py install < /dev/null
          "$PYTHON_BIN" plamen.py install --codex < /dev/null
          "$PYTHON_BIN" plamen.py install < /dev/null
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$CLEAN_HOME/.local/bin/plamen-claude.cmd" --version
            "$CLEAN_HOME/.local/bin/plamen-codex.cmd" --version
          else
            "$CLEAN_HOME/.local/bin/plamen-claude" --version
            "$CLEAN_HOME/.local/bin/plamen-codex" --version
          fi
      - name: Verify rename — codex/ absent, codex-adapter/ present
        # F6 regression guard.
        shell: bash
        run: |
          test ! -e codex
          test -d codex-adapter
      - name: Verify exact Windows interpreter contract (no shim mutation)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          python -c "import sys; assert sys.version_info[:2] == (3, 12)"
      - name: Verify wizards + docs use python3 (no bare `python` for the driver)
        # Regression guard. Exit code 127 ("command not found") was hit on
        # Linux + macOS because wizards hardcoded `python ~/.claude/scripts/
        # plamen_driver.py` while POSIX defaults to `python3`. The bare
        # `python` form only works on Windows (and on POSIX distros that
        # installed the `python-is-python3` shim, which is not default).
        shell: bash
        run: |
          set -e
          BAD=$(grep -rnE 'python ~/(\.claude|\.plamen)/scripts/plamen_driver\.py' \
              commands/ docs/ rules/ README.md SETUP.md 2>&1 || true)
          # Filter out lines where `python` is preceded by `python3` (e.g.
          # `python3 ~/.claude/...`) — grep PCRE lookbehind isn't on every
          # runner, so do it as a second pass.
          BAD=$(echo "$BAD" | grep -v "python3 ~/" || true)
          if [ -n "$BAD" ]; then
            echo "FAIL: bare 'python' (not 'python3') invocations found in user-facing docs:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: all driver invocations in docs use python3"
