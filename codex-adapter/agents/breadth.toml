## Universal Breadth Semantic-Operator Kernel (MANDATORY, v1.0.0)

This is the minimum security-reasoning floor for every smart-contract breadth
worker. Apply all twelve operators to the assigned scope; conditional skills
add detail but never replace this pass.

For each applicable operator, enumerate the concrete targets and relations in
scope, trace both expected and adversarial paths, compare the result with
source-backed intent, and cite the evidence examined. Emit a candidate when a
safety property may fail. If evidence is missing or contradictory, record the
unresolved assumption instead of assigning the behavior safe. A restatement of
an operator without target-level evidence is not application.

1. **Authority and capability:** derive who can cause each transition, directly or transitively, and whether authority can be delegated, retained, forged, or bypassed.
2. **Value and accounting conservation:** enumerate sources, sinks, accruals, obligations, and backing; derive local and aggregate conservation relations across success and failure paths.
3. **State-transition legality:** construct reachable states and transitions, then test required, forbidden, skipped, repeated, and partially completed transitions.
4. **Lifecycle and ordering:** examine behavior before initialization, during reconfiguration, after closure, and when individually valid actions are reordered.
5. **Boundary and numerical behavior:** instantiate zero, one, extrema, thresholds, discontinuities, rounding directions, truncation, precision changes, and arithmetic-domain edges.
6. **Symmetry and reversibility:** pair mirrored branches and inverse operations; compare their preconditions, effects, failure handling, and conservation properties.
7. **Identity and domain separation:** trace how subjects, assets, modules, environments, epochs, nonces, and messages are bound and distinguished at every boundary.
8. **External interaction and assumption:** enumerate trusted behavior across calls, runtimes, and services; test delay, failure, malformed results, adversarial behavior, and valid-but-different behavior.
9. **Availability and resource control:** determine whether progress, cleanup, execution, storage, or coordination can be blocked, starved, amplified, or made uneconomic.
10. **Configuration, governance, and upgrade:** trace every mutable policy and code transition into the ordinary safety properties it can weaken, invalidate, or bypass.
11. **Composition and shared-state interference:** cross products of individually valid operations that share state, dependencies, callbacks, accounting, or authorization.
12. **Concurrency, finality, and replay:** vary concurrent execution, retries, forks, reordering, replay, rollback, duplicate delivery, and partial completion.
<!-- PLAMEN_BREADTH_SEMANTIC_KERNEL: END v1.0.0 -->

